<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>陈怡安模块架构图 - Freelite</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1020px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .stitle {
    font-size: 16px;
    font-weight: 600;
    fill: var(--muted);
  }
  .label {
    font-size: 13px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 11px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
    rx: 6;
  }
  .neutral { fill: var(--neutral); }
  .input { fill: var(--input); }
  .process { fill: var(--process); }
  .storage { fill: var(--storage); }
  .external { fill: var(--external); }
  .risk { fill: var(--risk); }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .zone {
    fill: none;
    stroke: var(--line);
    stroke-width: 1;
    stroke-dasharray: 6 5;
    opacity: 0.8;
  }
</style>
<main>
  <svg viewBox="0 0 980 860" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="var(--line)"/>
      </marker>
    </defs>

    <!-- Title -->
    <text x="490" y="30" text-anchor="middle" class="title">陈怡安 模块架构图</text>
    <text x="490" y="50" text-anchor="middle" class="stitle">用户系统 · 聊天弹窗 · 钱包</text>

    <!-- ====== 边界框 ====== -->

    <!-- 用户系统 Zone -->
    <rect x="20" y="70" width="300" height="380" class="zone" rx="10"/>
    <text x="170" y="90" text-anchor="middle" class="small" font-weight="600">用户系统</text>

    <!-- 聊天弹窗 Zone -->
    <rect x="340" y="70" width="300" height="380" class="zone" rx="10"/>
    <text x="490" y="90" text-anchor="middle" class="small" font-weight="600">聊天与交付</text>

    <!-- 钱包 Zone -->
    <rect x="660" y="70" width="300" height="380" class="zone" rx="10"/>
    <text x="810" y="90" text-anchor="middle" class="small" font-weight="600">钱包</text>

    <!-- 公共层 Zone -->
    <rect x="170" y="480" width="640" height="120" class="zone" rx="10"/>
    <text x="490" y="500" text-anchor="middle" class="small" font-weight="600">公共层（陈怡安也参与）</text>

    <!-- 数据库 Zone -->
    <rect x="340" y="630" width="300" height="200" class="zone" rx="10"/>
    <text x="490" y="650" text-anchor="middle" class="small" font-weight="600">数据库表（MySQL）</text>

    <!-- ====== 用户系统 - Servlet ====== -->
    <rect x="40" y="110" width="180" height="36" class="node input"/>
    <text x="130" y="133" text-anchor="middle" class="label">LoginServlet</text>

    <rect x="240" y="110" width="60" height="36" class="node input"/>
    <text x="270" y="133" text-anchor="middle" class="label" font-size="11">→ /login</text>

    <rect x="40" y="160" width="180" height="36" class="node input"/>
    <text x="130" y="183" text-anchor="middle" class="label">RegisterServlet</text>

    <rect x="240" y="160" width="60" height="36" class="node input"/>
    <text x="270" y="183" text-anchor="middle" class="label" font-size="11">→ /register</text>

    <rect x="40" y="210" width="180" height="36" class="node input"/>
    <text x="130" y="233" text-anchor="middle" class="label">LogoutServlet</text>

    <rect x="240" y="210" width="60" height="36" class="node input"/>
    <text x="270" y="233" text-anchor="middle" class="label" font-size="11">→ /logout</text>

    <rect x="40" y="260" width="180" height="36" class="node input"/>
    <text x="130" y="283" text-anchor="middle" class="label">ProfileServlet</text>

    <rect x="240" y="260" width="60" height="36" class="node input"/>
    <text x="270" y="283" text-anchor="middle" class="label" font-size="11">→ /profile</text>

    <rect x="40" y="310" width="180" height="36" class="node input"/>
    <text x="130" y="333" text-anchor="middle" class="label">EditProfileServlet</text>

    <rect x="240" y="310" width="60" height="36" class="node input"/>
    <text x="270" y="333" text-anchor="middle" class="label" font-size="11">→ /editProfile</text>

    <rect x="40" y="360" width="180" height="36" class="node input"/>
    <text x="130" y="383" text-anchor="middle" class="label">SwitchRoleServlet</text>

    <rect x="240" y="360" width="60" height="36" class="node input"/>
    <text x="270" y="383" text-anchor="middle" class="label" font-size="11">→ /switchRole</text>

    <!-- User / UserDao 数据层 -->
    <rect x="120" y="410" width="100" height="30" class="node storage"/>
    <text x="170" y="430" text-anchor="middle" class="small" font-weight="600">User + UserDao</text>

    <!-- ====== 聊天弹窗 ====== -->
    <rect x="355" y="110" width="270" height="36" class="node input"/>
    <text x="490" y="133" text-anchor="middle" class="label">ChatDeliveryApiServlet</text>

    <rect x="355" y="160" width="270" height="36" class="node input"/>
    <text x="490" y="183" text-anchor="middle" class="label">ChatMessageApiServlet</text>

    <rect x="355" y="210" width="270" height="36" class="node input"/>
    <text x="490" y="233" text-anchor="middle" class="label">DeliveryChatServlet</text>

    <rect x="355" y="260" width="270" height="36" class="node input"/>
    <text x="490" y="283" text-anchor="middle" class="label">DeliveryDownloadServlet</text>

    <rect x="355" y="310" width="270" height="36" class="node input"/>
    <text x="490" y="333" text-anchor="middle" class="label">MyChatProjectsServlet</text>

    <!-- 聊天数据层 -->
    <rect x="405" y="360" width="170" height="30" class="node storage"/>
    <text x="490" y="380" text-anchor="middle" class="small" font-weight="600">Delivery + DeliveryDao</text>

    <rect x="405" y="400" width="170" height="30" class="node storage"/>
    <text x="490" y="420" text-anchor="middle" class="small" font-weight="600">ProjectMessage + Dao</text>

    <!-- ====== 钱包 ====== -->
    <rect x="675" y="110" width="270" height="36" class="node input"/>
    <text x="810" y="133" text-anchor="middle" class="label">WalletServlet</text>

    <rect x="675" y="160" width="270" height="36" class="node input"/>
    <text x="810" y="183" text-anchor="middle" class="label">RechargeServlet</text>

    <!-- 钱包数据层 -->
    <rect x="725" y="210" width="170" height="30" class="node storage"/>
    <text x="810" y="230" text-anchor="middle" class="small" font-weight="600">Wallet + WalletDao</text>

    <rect x="725" y="250" width="170" height="30" class="node storage"/>
    <text x="810" y="270" text-anchor="middle" class="small" font-weight="600">TransactionLog + Dao</text>

    <!-- ====== 公共层 ====== -->
    <rect x="190" y="500" width="150" height="36" class="node process"/>
    <text x="265" y="523" text-anchor="middle" class="label">AuthFilter</text>

    <rect x="360" y="500" width="150" height="36" class="node process"/>
    <text x="435" y="523" text-anchor="middle" class="label">AuthUtil</text>

    <rect x="530" y="500" width="150" height="36" class="node process"/>
    <text x="605" y="523" text-anchor="middle" class="label">EscrowService</text>

    <rect x="360" y="545" width="150" height="36" class="node process"/>
    <text x="435" y="568" text-anchor="middle" class="label">DBUtil</text>

    <!-- ====== 数据库表 ====== -->
    <rect x="355" y="650" width="130" height="30" class="node storage"/>
    <text x="420" y="670" text-anchor="middle" class="small">user</text>

    <rect x="505" y="650" width="130" height="30" class="node storage"/>
    <text x="570" y="670" text-anchor="middle" class="small">wallet</text>

    <rect x="355" y="695" width="130" height="30" class="node storage"/>
    <text x="420" y="715" text-anchor="middle" class="small">delivery</text>

    <rect x="505" y="695" width="130" height="30" class="node storage"/>
    <text x="570" y="715" text-anchor="middle" class="small">transaction_log</text>

    <rect x="355" y="740" width="280" height="30" class="node storage"/>
    <text x="495" y="760" text-anchor="middle" class="small">project_message</text>

    <rect x="355" y="785" width="280" height="30" class="node storage"/>
    <text x="495" y="805" text-anchor="middle" class="small">task_order（通过 EscrowService 调用）</text>

    <!-- ====== 连线 ====== -->
    <!-- LoginServlet → UserDao -->
    <line x1="130" y1="146" x2="170" y2="410" class="edge" marker-end="url(#arrow)"/>
    <!-- RegisterServlet → UserDao -->
    <line x1="130" y1="196" x2="170" y2="410" class="edge" marker-end="url(#arrow)"/>
    <!-- ProfileServlet → UserDao -->
    <line x1="130" y1="296" x2="170" y2="410" class="edge" marker-end="url(#arrow)"/>

    <!-- WalletServlet → WalletDao -->
    <line x1="810" y1="146" x2="810" y2="210" class="edge" marker-end="url(#arrow)"/>
    <!-- RechargeServlet → WalletDao -->
    <line x1="810" y1="196" x2="810" y2="210" class="edge" marker-end="url(#arrow)"/>

    <!-- 聊天 Servlet → 聊天数据层 -->
    <line x1="490" y1="146" x2="490" y2="360" class="edge" marker-end="url(#arrow)"/>
    <line x1="490" y1="196" x2="490" y2="400" class="edge" marker-end="url(#arrow)"/>

    <!-- 数据层 → DBUtil -->
    <line x1="170" y1="440" x2="435" y2="545" class="edge" marker-end="url(#arrow)"/>
    <line x1="490" y1="430" x2="435" y2="545" class="edge" marker-end="url(#arrow)"/>
    <line x1="810" y1="280" x2="435" y2="545" class="edge" marker-end="url(#arrow)"/>

    <!-- DBUtil → 数据库 -->
    <line x1="435" y1="581" x2="420" y2="650" class="edge" marker-end="url(#arrow)"/>
    <line x1="435" y1="581" x2="570" y2="650" class="edge" marker-end="url(#arrow)"/>
    <line x1="435" y1="581" x2="420" y2="695" class="edge" marker-end="url(#arrow)"/>
    <line x1="435" y1="581" x2="570" y2="695" class="edge" marker-end="url(#arrow)"/>
    <line x1="435" y1="581" x2="495" y2="740" class="edge" marker-end="url(#arrow)"/>
    <line x1="435" y1="581" x2="495" y2="785" class="edge" marker-end="url(#arrow)"/>

    <!-- AuthFilter 连线到各 Servlet -->
    <line x1="265" y1="536" x2="130" y2="110" class="edge"/>
    <line x1="265" y1="536" x2="490" y2="110" class="edge"/>
    <line x1="265" y1="536" x2="810" y2="110" class="edge"/>

    <!-- EscrowService 连线 -->
    <line x1="605" y1="536" x2="490" y2="785" class="edge" marker-end="url(#arrow)"/>
  </svg>
</main>
